<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Devotion — Suspect X</title>
<link rel="icon" href="data:,">
<meta name="description" content="A dual-perspective narrative game after Keigo Higashino's The Devotion of Suspect X.">
<meta property="og:title" content="Devotion — Suspect X">
<meta property="og:description" content="A dual-perspective visual novel. One constructs the problem; the other comes to solve it.">
<meta property="og:type" content="website">
<style>
  :root {
    --ink: #eef0f4;
    --dim: #9aa0ac;
    --accent: #7fa8c9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; }
  body {
    font-family: "Georgia", "Songti SC", "Times New Roman", serif;
    color: var(--ink);
    user-select: none; -webkit-user-select: none;
    cursor: pointer;
  }

  /* photo now lives inside the WebGL canvas; keep a dark fallback only */
  #scene { position: fixed; inset: 0; z-index: 0; background: #05060a; }

  /* three.js canvas — the living atmosphere (photo + bloom + grade), full frame */
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; display: block; pointer-events: none; }

  /* character sprites — darkened to noir figures against the lit scene */
  #actors { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  .actor {
    position: absolute; bottom: -2vh; left: 50%;
    height: 76vh; max-height: 720px;
    transform: translateX(-50%) scale(1);
    opacity: 0; transition: opacity .7s ease, bottom .7s ease;
    filter: brightness(.62) contrast(1.06) drop-shadow(0 12px 30px rgba(0,0,0,.7));
    will-change: opacity;
  }
  .actor.in { opacity: 1; bottom: 0; }

  /* vignette + film grain are now done in the WebGL FinalGrade post pass */
  .bar { position: fixed; left: 0; width: 100%; height: 7vh; z-index: 5; pointer-events: none;
         background: #000; }
  #barTop { top: 0; } #barBot { bottom: 0; }

  /* perspective banner */
  #persp {
    position: fixed; top: calc(7vh + 16px); right: 22px; z-index: 7;
    font-size: 14px; letter-spacing: .28em; text-transform: uppercase;
    padding: 6px 14px; border: 1px solid #ccc6; border-radius: 3px;
    background: rgba(0,0,0,.4); backdrop-filter: blur(3px);
    opacity: 0; transition: opacity .6s ease; pointer-events: none;
  }
  #persp.show { opacity: 1; }

  /* clue toast */
  #notify {
    position: fixed; top: calc(7vh + 16px); left: 22px; z-index: 7;
    font-size: 15px; letter-spacing: .04em; color: #dfe7d8;
    padding: 9px 16px; border-left: 2px solid var(--accent);
    background: rgba(10,14,20,.72); backdrop-filter: blur(4px);
    transform: translateX(-140%); transition: transform .45s cubic-bezier(.2,.9,.3,1);
  }
  #notify.show { transform: translateX(0); }

  /* dialogue box */
  #textbox {
    position: fixed; left: 50%; bottom: 9.5vh; transform: translateX(-50%) translateY(14px);
    width: min(1000px, 88vw); z-index: 6;
    background: linear-gradient(180deg, rgba(8,10,16,.62), rgba(8,10,16,.86));
    border-top: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; padding: 26px 34px 30px;
    box-shadow: 0 18px 60px rgba(0,0,0,.5); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .35s ease, transform .35s ease;
  }
  #textbox.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #name {
    position: absolute; top: -16px; left: 30px;
    font-size: 19px; font-weight: 600; letter-spacing: .04em;
    padding: 4px 16px; border-radius: 4px;
    background: rgba(8,10,16,.9); border: 1px solid rgba(255,255,255,.1);
    opacity: 0; transition: opacity .3s ease;
  }
  #name.show { opacity: 1; }
  #text { font-size: 21px; line-height: 1.75; letter-spacing: .012em; min-height: 2.2em; }
  #text.italic { font-style: italic; color: #c9d4e2; }

  /* centered title cards */
  #card {
    position: fixed; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center;
    padding: 12vh 10vw; pointer-events: none;
    opacity: 0; transition: opacity .6s ease;
    text-shadow: 0 2px 30px rgba(0,0,0,.8);
  }
  #card.show { opacity: 1; }
  #cardInner { text-align: center; line-height: 1.9; letter-spacing: .04em; max-width: 900px; }

  /* choices */
  #prompt {
    position: fixed; left: 50%; top: 30vh; transform: translateX(-50%);
    z-index: 6; font-size: 22px; color: #d7dae2; text-align: center;
    text-shadow: 0 2px 20px #000; opacity: 0; transition: opacity .4s ease; pointer-events: none;
    width: 80vw;
  }
  #prompt.show { opacity: 1; }
  #choices {
    position: fixed; left: 50%; top: 40vh; transform: translateX(-50%);
    z-index: 8; display: none; flex-direction: column; gap: 16px; width: min(760px, 86vw);
  }
  #choices.show { display: flex; animation: rise .5s ease; }
  @keyframes rise { from { opacity: 0; transform: translateX(-50%) translateY(20px); }
                    to   { opacity: 1; transform: translateX(-50%) translateY(0); } }
  .choice {
    font-family: inherit; font-size: 20px; color: var(--ink);
    background: rgba(12,16,24,.74); border: 1px solid rgba(255,255,255,.14);
    border-left: 3px solid var(--accent);
    padding: 18px 26px; border-radius: 8px; cursor: pointer; text-align: left;
    backdrop-filter: blur(6px); transition: all .22s ease;
  }
  .choice:hover { background: rgba(127,168,201,.22); border-left-color: #cfe0ef;
                  transform: translateX(6px); }

  /* advance hint */
  #hint {
    position: fixed; right: 30px; bottom: calc(9.5vh - 4px); z-index: 6;
    font-size: 22px; color: var(--dim); opacity: 0; transition: opacity .4s ease;
    animation: blink 1.4s ease-in-out infinite; pointer-events: none;
  }
  #hint.show { opacity: .8; }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:.8} }

  /* restart button */
  #restartBtn {
    position: fixed; top: calc(7vh + 14px); left: 50%; transform: translateX(-50%);
    z-index: 9; font-family: inherit; font-size: 13px; letter-spacing: .1em; color: var(--dim);
    background: rgba(0,0,0,.35); border: 1px solid #ffffff22; border-radius: 20px;
    padding: 5px 14px; cursor: pointer; opacity: .35; transition: opacity .25s;
  }
  #restartBtn:hover { opacity: 1; }

  /* start screen */
  #start {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(80% 60% at 50% 40%, rgba(20,30,44,.4), rgba(5,6,10,.9));
    transition: opacity .9s ease;
  }
  #start.gone { opacity: 0; }
  #start h1 { font-size: 62px; font-weight: 400; letter-spacing: .14em; margin-bottom: 6px;
              text-shadow: 0 4px 40px rgba(0,0,0,.9); }
  #start .sub { font-size: 20px; color: var(--accent); letter-spacing: .34em; margin-bottom: 8px; }
  #start .by { font-size: 15px; color: var(--dim); margin-bottom: 46px; line-height: 1.7; }
  #beginBtn {
    font-family: inherit; font-size: 21px; letter-spacing: .18em; color: var(--ink);
    background: transparent; border: 1px solid #ffffff44; border-radius: 4px;
    padding: 14px 46px; cursor: pointer; transition: all .3s ease;
  }
  #beginBtn:hover { background: rgba(127,168,201,.18); border-color: #cfe0ef; letter-spacing: .24em; }
  #start .note { margin-top: 40px; font-size: 12px; color: #6b7280; letter-spacing: .05em; }

  @media (max-width: 640px) {
    #text { font-size: 18px; } #card { font-size: 21px; }
    .choice { font-size: 17px; padding: 14px 18px; }
    .actor { height: 60vh; }
    #start h1 { font-size: 40px; }
  }
</style>
</head>
<body>
  <div id="scene"></div>
  <canvas id="gl"></canvas>
  <div id="actors"></div>

  <div class="bar" id="barTop"></div>
  <div class="bar" id="barBot"></div>

  <div id="persp"></div>
  <div id="notify"></div>
  <button id="restartBtn">↻ TITLE</button>

  <div id="card"><div id="cardInner"></div></div>
  <div id="prompt"></div>
  <div id="choices"></div>

  <div id="textbox">
    <div id="name"></div>
    <div id="text"></div>
  </div>
  <div id="hint">▾</div>

  <div id="start">
    <div class="sub">DEVOTION</div>
    <h1>Suspect&nbsp;X</h1>
    <div class="by">
      A dual-perspective narrative<br>
      after Keigo Higashino's <i>The Devotion of Suspect X</i>
    </div>
    <button id="beginBtn">BEGIN</button>
    <div class="note">click or press space to advance · headphones recommended</div>
  </div>

  <script src="vendor/three.min.js"></script>
  <!-- r128 postprocessing (UMD examples/js) — local, offline-safe. ORDER MATTERS. -->
  <script src="vendor/pp/CopyShader.js"></script>
  <script src="vendor/pp/LuminosityHighPassShader.js"></script>
  <script src="vendor/pp/EffectComposer.js"></script>
  <script src="vendor/pp/RenderPass.js"></script>
  <script src="vendor/pp/ShaderPass.js"></script>
  <script src="vendor/pp/MaskPass.js"></script>
  <script src="vendor/pp/UnrealBloomPass.js"></script>
  <script src="atmos.js"></script>
  <script src="story.js"></script>
  <script src="engine.js"></script>
</body>
</html>
