    <ellipse cx="100" cy="92" rx="35" ry="44" fill="#f4f2ee"/>
    <ellipse cx="100" cy="92" rx="35" ry="44" fill="none" stroke="#d8d4cc" stroke-width="2"/>
    <!-- 细长眼缝 -->
    <path d="M82 88 L94 86" stroke="#1a1c24" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M106 86 L118 88" stroke="#1a1c24" stroke-width="3.5" stroke-linecap="round"/>
    <!-- 面具反光 -->
    <path d="M76 70 Q84 58 98 54" fill="none" stroke="#ffffff" stroke-width="3" opacity=".55" stroke-linecap="round"/>
  </g>
  <!-- 侧发丝 -->
  <path d="M64 84 Q60 108 70 126" fill="none" stroke="#12141e" stroke-width="10" stroke-linecap="round"/>
</svg>
