<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220">
  <!-- 刻着「林弦」的旧保险箱:掉漆、锈迹、转盘 -->
  <rect x="46" y="16" width="168" height="192" rx="10" fill="#3d443c"/>
  <rect x="56" y="26" width="148" height="172" rx="7" fill="#4c554a"/>
  <rect x="56" y="26" width="148" height="172" rx="7" fill="none" stroke="#2b302a" stroke-width="3"/>
  <!-- 掉漆斑块 -->
  <g fill="#6a7268" opacity=".8">
    <path d="M70 40 q10 -6 18 2 q-2 8 -12 8 q-9 -2 -6 -10Z"/>
    <path d="M170 160 q12 -4 16 6 q-4 10 -14 6 q-8 -5 -2 -12Z"/>
    <path d="M64 150 q8 -3 10 4 q-2 7 -9 5 q-6 -3 -1 -9Z"/>
  </g>
  <g fill="#7a5a42" opacity=".7">
    <path d="M188 60 q8 2 6 10 q-8 4 -12 -2 q0 -7 6 -8Z"/>
    <path d="M78 180 q7 0 7 7 q-5 5 -10 1 q-2 -6 3 -8Z"/>
  </g>
  <!-- 铭牌:林弦 -->
  <rect x="92" y="44" width="76" height="30" rx="4" fill="#2b302a" stroke="#807048" stroke-width="2"/>
  <text x="130" y="67" font-size="22" text-anchor="middle" fill="#d8c890" font-family="serif" letter-spacing="6">林弦</text>
  <!-- 转盘 -->
  <circle cx="130" cy="128" r="30" fill="#39403a" stroke="#242822" stroke-width="4"/>
  <circle cx="130" cy="128" r="20" fill="#4c554a" stroke="#242822" stroke-width="2"/>
  <g stroke="#c8cabe" stroke-width="2.4" stroke-linecap="round">
    <path d="M130 102 L130 110"/><path d="M130 146 L130 154"/>
    <path d="M104 128 L112 128"/><path d="M148 128 L156 128"/>
    <path d="M112 110 L117 115"/><path d="M148 110 L143 115"/>
  </g>
  <circle cx="130" cy="128" r="5" fill="#242822"/>
  <!-- 键孔面板 -->
  <rect x="108" y="168" width="44" height="16" rx="3" fill="#2b302a"/>
  <circle cx="118" cy="176" r="3.2" fill="#ff5d6c">
    <animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <rect x="128" y="172" width="20" height="8" rx="2" fill="#161a15"/>
  <!-- 铰链 -->
  <rect x="46" y="52" width="10" height="26" rx="3" fill="#2b302a"/>
  <rect x="46" y="142" width="10" height="26" rx="3" fill="#2b302a"/>
</svg>
