<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220">
  <!-- VV的老照片:泛黄相纸,长发大胡子男人立于公式白板前 -->
  <g transform="rotate(5 130 110)">
    <rect x="52" y="30" width="156" height="160" rx="4" fill="#e8dfc8"/>
    <rect x="62" y="40" width="136" height="118" fill="#8a7f66"/>
    <!-- 白板与公式 -->
    <rect x="70" y="48" width="120" height="70" fill="#c9c2ae"/>
    <g stroke="#6a6252" stroke-width="2" stroke-linecap="round" opacity=".85">
      <path d="M78 58 L112 58"/><path d="M78 68 L104 68"/><path d="M120 60 L152 60"/>
      <path d="M78 80 L96 80"/><path d="M104 78 L140 82"/><path d="M148 72 L180 72"/>
      <path d="M120 92 L172 92"/><path d="M78 102 L110 100"/>
    </g>
    <text x="168" y="112" font-size="16" fill="#4c463a" font-family="serif" font-weight="bold">42</text>
    <!-- 长发大胡子的男人(背对白板的剪影) -->
    <g fill="#3a352c">
      <path d="M112 158 C112 128 118 116 130 112 L142 112 C154 116 160 128 160 158 Z"/>
      <ellipse cx="136" cy="96" rx="16" ry="18"/>
      <path d="M120 92 C118 76 154 76 152 92 C154 108 150 122 146 128 L126 128 C122 122 118 108 120 92 Z"/>
      <path d="M126 108 C126 120 146 120 146 108 L146 122 C142 130 130 130 126 122 Z"/>
    </g>
    <!-- 泛黄与划痕 -->
    <rect x="62" y="40" width="136" height="118" fill="#c2a86a" opacity=".18"/>
    <path d="M70 46 L86 62 M180 140 L192 152" stroke="#f4ecd8" stroke-width="1.4" opacity=".6"/>
    <!-- 背面一角翻起,写着 VV -->
    <text x="130" y="182" font-size="20" text-anchor="middle" fill="#7a6c50" font-family="serif" font-style="italic" letter-spacing="3">VV</text>
  </g>
</svg>
