<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220">
  <!-- 天才俱乐部请柬:暗红卡片、烫金 -->
  <defs>
    <linearGradient id="ivc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a1420"/><stop offset="1" stop-color="#38101c"/>
    </linearGradient>
    <linearGradient id="ivg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#caa24e"/><stop offset=".5" stop-color="#f2dc9a"/><stop offset="1" stop-color="#caa24e"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-7 130 110)">
    <rect x="40" y="48" width="180" height="124" rx="8" fill="url(#ivc)"/>
    <rect x="40" y="48" width="180" height="124" rx="8" fill="none" stroke="#7a2432" stroke-width="2"/>
    <rect x="50" y="58" width="160" height="104" rx="5" fill="none" stroke="url(#ivg)" stroke-width="2.4"/>
    <!-- 角饰 -->
    <g stroke="url(#ivg)" stroke-width="2" fill="none">
      <path d="M56 72 Q56 64 64 64"/><path d="M204 72 Q204 64 196 64"/>
      <path d="M56 148 Q56 156 64 156"/><path d="M204 148 Q204 156 196 156"/>
    </g>
    <text x="130" y="104" font-size="26" text-anchor="middle" fill="url(#ivg)" font-family="serif" letter-spacing="10">天才俱乐部</text>
    <path d="M84 120 L176 120" stroke="url(#ivg)" stroke-width="1.6"/>
    <text x="130" y="142" font-size="11" text-anchor="middle" fill="#caa24e" font-family="serif" letter-spacing="4">INVITATION</text>
    <!-- 光泽扫过 -->
    <rect x="40" y="48" width="30" height="124" fill="#ffffff" opacity=".08">
      <animate attributeName="x" values="30;210;30" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
