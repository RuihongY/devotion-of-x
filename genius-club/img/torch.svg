<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220">
  <!-- 氧乙炔气割枪:喷枪 + 白炽火舌 -->
  <defs>
    <linearGradient id="tcf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#ffe9a8"/><stop offset=".75" stop-color="#ff9a3c"/><stop offset="1" stop-color="#ff5d2c" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 双气管 -->
  <path d="M18 190 C60 186 76 168 92 148" fill="none" stroke="#7a3c3c" stroke-width="7" stroke-linecap="round"/>
  <path d="M14 176 C56 174 72 158 88 140" fill="none" stroke="#3c5a7a" stroke-width="7" stroke-linecap="round"/>
  <!-- 枪体 -->
  <g transform="rotate(-18 120 130)">
    <rect x="84" y="120" width="64" height="16" rx="7" fill="#5a6478"/>
    <rect x="140" y="122" width="34" height="12" rx="5" fill="#8a94a8"/>
    <rect x="96" y="134" width="14" height="26" rx="5" fill="#434c60"/>
    <circle cx="92" cy="128" r="9" fill="#8a94a8" stroke="#434c60" stroke-width="3"/>
    <!-- 喷嘴 -->
    <path d="M174 124 L188 126 L188 130 L174 132 Z" fill="#b8c0cc"/>
    <!-- 火舌 -->
    <path d="M188 128 C210 116 236 122 252 128 C236 134 210 140 188 128 Z" fill="url(#tcf)">
      <animate attributeName="opacity" values="1;.75;1;.85;1" dur=".5s" repeatCount="indefinite"/>
    </path>
    <path d="M188 128 C200 123 212 125 222 128 C212 131 200 133 188 128 Z" fill="#cfe6ff">
      <animate attributeName="opacity" values=".9;.55;.9" dur=".34s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- 迸溅火花 -->
  <g fill="#ffd27a">
    <circle cx="216" cy="96" r="2.4"><animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="232" cy="140" r="2"><animate attributeName="opacity" values="0;1;0" dur=".9s" begin=".3s" repeatCount="indefinite"/></circle>
    <circle cx="204" cy="150" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="1.3s" begin=".6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
