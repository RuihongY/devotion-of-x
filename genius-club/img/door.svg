<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 220">
  <!-- 金库密码门:银色重门 + 键盘红灯 -->
  <defs>
    <linearGradient id="drm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a94a8"/><stop offset=".5" stop-color="#c4ccd8"/><stop offset="1" stop-color="#788296"/>
    </linearGradient>
  </defs>
  <rect x="30" y="10" width="200" height="200" rx="10" fill="#3a4152"/>
  <rect x="42" y="20" width="176" height="184" rx="7" fill="url(#drm)"/>
  <rect x="42" y="20" width="176" height="184" rx="7" fill="none" stroke="#5a6478" stroke-width="3"/>
  <!-- 中缝 -->
  <rect x="127" y="20" width="6" height="184" fill="#59627a"/>
  <!-- 铆钉 -->
  <g fill="#6e788c">
    <circle cx="54" cy="34" r="4"/><circle cx="206" cy="34" r="4"/>
    <circle cx="54" cy="190" r="4"/><circle cx="206" cy="190" r="4"/>
    <circle cx="54" cy="112" r="4"/><circle cx="206" cy="112" r="4"/>
  </g>
  <!-- 转轮把手 -->
  <circle cx="96" cy="112" r="26" fill="#9aa4b8" stroke="#59627a" stroke-width="4"/>
  <circle cx="96" cy="112" r="7" fill="#59627a"/>
  <g stroke="#59627a" stroke-width="5" stroke-linecap="round">
    <path d="M96 90 L96 100"/><path d="M96 124 L96 134"/>
    <path d="M74 112 L84 112"/><path d="M108 112 L118 112"/>
  </g>
  <!-- 键盘面板 -->
  <rect x="146" y="76" width="58" height="76" rx="6" fill="#232838"/>
  <rect x="152" y="84" width="46" height="14" rx="3" fill="#0d1018"/>
  <circle cx="192" cy="91" r="3.6" fill="#ff5d6c">
    <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <g fill="#3c4356">
    <rect x="153" y="104" width="12" height="10" rx="2"/><rect x="169" y="104" width="12" height="10" rx="2"/><rect x="185" y="104" width="12" height="10" rx="2"/>
    <rect x="153" y="118" width="12" height="10" rx="2"/><rect x="169" y="118" width="12" height="10" rx="2"/><rect x="185" y="118" width="12" height="10" rx="2"/>
    <rect x="153" y="132" width="12" height="10" rx="2"/><rect x="169" y="132" width="12" height="10" rx="2"/><rect x="185" y="132" width="12" height="10" rx="2"/>
  </g>
</svg>
