  </defs>
  <!-- 身躯:衬衫+松掉的领带 -->
  <path d="M50 260 C54 208 66 182 86 172 L114 172 C134 182 146 208 150 260 Z" fill="url(#ljj)"/>
  <path d="M86 172 L100 192 L114 172 L107 166 L100 178 L93 166 Z" fill="#dfe0e4"/>
