  <rect x="76" y="94" width="18" height="11" rx="2" fill="#cfe2ea" opacity=".3"/>
  <rect x="106" y="94" width="18" height="11" rx="2" fill="#cfe2ea" opacity=".3"/>
  <!-- 疲惫眉眼与叹气嘴 -->
  <path d="M78 88 L94 86 M106 86 L122 88" stroke="#2c2620" stroke-width="3" stroke-linecap="round"/>
  <path d="M92 124 Q100 121 108 124" fill="none" stroke="#a07a58" stroke-width="3.4" stroke-linecap="round"/>
