      <stop offset="0" stop-color="#2b2733"/><stop offset="1" stop-color="#191622"/>
    </linearGradient>
  </defs>
  <!-- 壮硕身躯 -->
  <path d="M28 260 C30 200 44 168 74 156 L126 156 C156 168 170 200 172 260 Z" fill="url(#bfj)"/>
