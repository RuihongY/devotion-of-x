  <g>
    <path d="M52 44 L70 14 L84 38 Z" fill="#f2f0ea"/>
    <path d="M148 44 L130 14 L116 38 Z" fill="#f2f0ea"/>
    <path d="M58 42 L69 24 L78 39 Z" fill="#f2a0b5"/>
    <path d="M142 42 L131 24 L122 39 Z" fill="#f2a0b5"/>
