    <ellipse cx="100" cy="86" rx="55" ry="52" fill="none" stroke="#d8d4c8" stroke-width="2"/>
    <!-- 眯眯眼 -->
    <path d="M66 80 Q78 70 90 80" fill="none" stroke="#2a2630" stroke-width="4" stroke-linecap="round"/>
    <path d="M110 80 Q122 70 134 80" fill="none" stroke="#2a2630" stroke-width="4" stroke-linecap="round"/>
