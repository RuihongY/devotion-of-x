<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>梦醒00:42 · 天才俱乐部</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">
<style>
  :root {
    --bg: #0b0e14;
    --panel: #131826;
    --panel2: #1a2032;
    --line: #2a3350;
    --ink: #dde3f0;
    --dim: #8a93ab;
    --accent: #6ea8ff;
    --gold: #e8c66a;
    --danger: #ff5d6c;
    --ok: #7ee0a3;
  }
  body.reality {
    --bg: #171310;
    --panel: #221c16;
    --panel2: #2b241c;
    --line: #4a3d2c;
    --ink: #f0e8dd;
    --dim: #ab9c8a;
    --accent: #ffc46e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 16px; line-height: 1.7;
    overflow: hidden;
    transition: background .8s;
    user-select: none; -webkit-user-select: none;
  }
  #app { height: 100%; max-width: 860px; margin: 0 auto; position: relative; display: flex; flex-direction: column; }

  /* ── 顶栏 ─────────────────────────── */
  #topbar {
    display: none; align-items: center; gap: 12px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    background: var(--panel); z-index: 5;
  }
  #topbar.on { display: flex; }
  #nightLabel { font-size: 14px; color: var(--dim); white-space: nowrap; }
  #clock { font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: .06em; white-space: nowrap; }
  #clock.late { color: var(--danger); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  #timebar { flex: 1; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; min-width: 40px; }
  #timefill { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; transition: width .4s; }
  #timefill.late { background: var(--danger); }
  #journalBtn {
    position: relative; background: var(--panel2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px;
    font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  #journalBtn .dot {
    display: none; position: absolute; top: -4px; right: -4px;
    width: 10px; height: 10px; border-radius: 50%; background: var(--danger);
  }
  #journalBtn.new .dot { display: block; }

  /* ── 主区域 ───────────────────────── */
  #main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; -webkit-overflow-scrolling: touch; }

  /* ── 标题屏 ───────────────────────── */
  #title {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px; gap: 10px;
    background:
      linear-gradient(rgba(8,10,16,.78), rgba(8,10,16,.9)),
      url("scenes/title.jpg") center/cover,
      radial-gradient(ellipse at 50% 120%, #1c2440 0%, transparent 60%);
  }
  #title .t-clock { font-size: 15px; letter-spacing: .5em; color: var(--dim); margin-left: .5em; }
  #title h1 { font-size: 44px; font-weight: 500; letter-spacing: .18em; margin: 4px 0 2px; text-shadow: 0 0 30px rgba(110,168,255,.35); }
  #title .sub { font-size: 15px; color: var(--accent); letter-spacing: .3em; margin-left: .3em; }
  #title .desc { max-width: 460px; font-size: 13px; color: var(--dim); margin: 22px 0 26px; line-height: 2; }
  .btn {
    display: block; width: 240px; padding: 12px; margin: 5px 0;
    background: var(--panel2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    font-size: 16px; letter-spacing: .1em; cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { border-color: var(--accent); background: #1c2a4a; }
  .btn.subtle { font-size: 13px; color: var(--dim); border-color: transparent; background: transparent; width: auto; }
  #title .credit { position: absolute; bottom: 16px; font-size: 11px; color: #566; letter-spacing: .08em; }

  /* ── 地图 ─────────────────────────── */
  #map { display: none; padding: 16px; }
  #map.on { display: block; }
  #mapHint { font-size: 13px; color: var(--dim); margin: 2px 2px 14px; }
  #locGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .loc {
    position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 10px; text-align: center; cursor: pointer;
    transition: border-color .2s, transform .1s;
  }
  .loc:hover { border-color: var(--accent); }
  .loc:active { transform: scale(.97); }
  .loc .icon { font-size: 30px; line-height: 1.3; }
  .loc .lname { font-size: 14px; margin-top: 4px; }
  .loc .ldist { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .loc.here { border-color: var(--gold); box-shadow: 0 0 12px rgba(232,198,106,.15); }
  .loc.here .ldist { color: var(--gold); }
  .loc.off { opacity: .35; pointer-events: none; }
  .loc .badge {
    position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff;
    font-size: 10px; padding: 2px 6px; border-radius: 8px; letter-spacing: .05em;
  }

  /* ── 地点面板 ─────────────────────── */
  #locPanel { display: none; padding: 16px; }
  #locPanel.on { display: block; }
  #locHead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  #locHead .icon { font-size: 30px; }
  #locHead h2 { font-size: 22px; font-weight: 500; letter-spacing: .08em; }
  #locDesc { font-size: 14px; color: var(--dim); margin-bottom: 16px; line-height: 1.9; }
  .action {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; text-align: left;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin: 8px 0; font-size: 15px; cursor: pointer;
    transition: border-color .2s;
  }
  .action:hover { border-color: var(--accent); }
  .action .cost { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .action.locked { opacity: .45; cursor: default; }
  .action.locked:hover { border-color: var(--line); }
  .action.leave { border-style: dashed; color: var(--dim); }

  /* ── 场景(对话) ─────────────────── */
  #sceneView { display: none; position: absolute; inset: 0; flex-direction: column; }
  #sceneView.on { display: flex; }
  #sceneArt {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 72px; opacity: .55; filter: saturate(.7);
    background: radial-gradient(ellipse at 50% 30%, rgba(110,168,255,.07), transparent 65%);
  }
  #dialog {
    background: linear-gradient(to top, var(--bg) 65%, transparent);
    padding: 10px 18px 18px; min-height: 220px;
  }
  #dbox {
    background: rgba(19,24,38,.92); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; min-height: 110px; cursor: pointer;
  }
  body.reality #dbox { background: rgba(34,28,22,.92); }
  #dname { font-size: 13px; letter-spacing: .12em; color: var(--accent); margin-bottom: 6px; }
  #dtext { font-size: 16px; line-height: 1.9; min-height: 60px; }
  #dnext { text-align: right; font-size: 12px; color: var(--dim); animation: pulse 1.6s infinite; height: 16px; }
  #choices { margin-top: 10px; display: none; flex-direction: column; gap: 8px; }
  #choices.on { display: flex; }
  .choice {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--panel2); color: var(--ink); text-align: left;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 14px; font-size: 15px; cursor: pointer;
  }
  .choice:hover { border-color: var(--accent); }
  .choice .cost { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .choice.locked { opacity: .5; cursor: default; }
  .choice.locked:hover { border-color: var(--line); }
  .choice.locked .cost { color: var(--danger); }

  /* ── 全屏卡片 ─────────────────────── */
  #card {
    display: none; position: fixed; inset: 0; z-index: 40;
    background: var(--bg);
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 30px; cursor: pointer;
  }
  #card.on { display: flex; }
  #card .big { font-size: 42px; letter-spacing: .2em; font-weight: 500; margin-bottom: 14px; white-space: pre-line; }
  #card .body { max-width: 480px; font-size: 15px; color: var(--dim); line-height: 2.1; white-space: pre-line; }
  #card .tap { margin-top: 40px; font-size: 12px; color: var(--dim); animation: pulse 1.6s infinite; }
  #card.doom { background: #000; }
  #card.doom .big { color: var(--danger); text-shadow: 0 0 40px rgba(255,93,108,.5); }
  #card.gold .big { color: var(--gold); text-shadow: 0 0 40px rgba(232,198,106,.4); }

  /* ── 白闪 & 震屏 ──────────────────── */
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 60; }
  #flash.go { animation: flashout 1s ease-out; }
  @keyframes flashout { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes shake {
    0%,100% { transform: translate(0,0); } 20% { transform: translate(-8px,4px); }
    40% { transform: translate(7px,-5px); } 60% { transform: translate(-5px,-4px); } 80% { transform: translate(4px,5px); }
  }
  #app.shake { animation: shake .5s linear 2; }
  #app.shake-s { animation: shake .22s linear 1; }
  #app.glitchfx { animation: gjit .3s steps(2) 2; }
  @keyframes gjit { 25% { transform: translate(-6px,2px); } 50% { transform: translate(5px,-3px); } 75% { transform: translate(-3px,-2px); } }

  /* ── FX 特效层 ────────────────────── */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 38; overflow: hidden; }
  .flashfx { position: absolute; inset: 0; opacity: 0; }
  @keyframes fxout { 0% { opacity: 1; } 100% { opacity: 0; } }
  .fx-bang { background: radial-gradient(circle at 50% 45%, #fff 0%, rgba(255,120,90,.7) 28%, transparent 66%); animation: fxout .38s ease-out forwards; }
  .fx-boom { background: radial-gradient(circle at 50% 55%, #fff 0%, #ffb347 22%, rgba(255,80,30,.8) 45%, transparent 78%); animation: fxout .9s ease-out forwards; }
  .fx-whiteout { background: #fff; animation: fxout 1.1s ease-in forwards; }
  .fx-alarm { box-shadow: inset 0 0 110px 34px rgba(255,40,60,.55); animation: fxpulse 1s ease-in-out 3; }
  @keyframes fxpulse { 0%,100% { opacity: 0; } 50% { opacity: 1; } }
  .fx-sirens { animation: fxsiren .8s linear 3; }
  @keyframes fxsiren {
    0%,100% { background: linear-gradient(90deg, rgba(255,40,60,.4), transparent 45%); }
    50% { background: linear-gradient(90deg, transparent 55%, rgba(70,130,255,.4)); }
  }
  .fx-glitch {
    background: repeating-linear-gradient(0deg, rgba(255,0,80,.10) 0 2px, transparent 2px 5px, rgba(0,200,255,.10) 5px 7px, transparent 7px 10px);
    mix-blend-mode: screen; animation: fxout .55s steps(4) forwards;
  }
  .fx-glow { background: radial-gradient(circle at 50% 55%, rgba(232,198,106,.6) 0%, rgba(232,198,106,.18) 38%, transparent 66%); animation: fxglow 1.6s ease-out forwards; }
  @keyframes fxglow { 0% { opacity: 0; transform: scale(.6); } 25% { opacity: 1; } 100% { opacity: 0; transform: scale(1.35); } }
  .fx-doomsweep {
    background: linear-gradient(to top, rgba(255,70,20,.7) 0%, rgba(120,20,10,.85) 35%, rgba(0,0,0,.95) 75%);
    animation: fxdoom 1.7s ease-in forwards;
  }
  @keyframes fxdoom { 0% { opacity: 0; transform: translateY(100%); } 55% { opacity: 1; transform: translateY(0); } 100% { opacity: 1; transform: translateY(0); } }
  .fx-reveal {
    position: absolute; left: 50%; top: 42%; font-size: 96px; opacity: 0;
    transform: translate(-50%,-50%) scale(.3); filter: drop-shadow(0 0 26px rgba(232,198,106,.7));
    animation: fxreveal 1.35s ease-out forwards;
  }
  @keyframes fxreveal {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(.3); }
    35% { opacity: 1; transform: translate(-50%,-50%) scale(1.12); }
    75% { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(1); }
  }
  .fx-p { position: absolute; left: 50%; top: 52%; border-radius: 2px; opacity: 1; animation: fxfly var(--d) ease-out forwards; }
  @keyframes fxfly { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
  .fx-p.debris { width: 7px; height: 7px; background: #c8b49a; }
  .fx-p.spark { width: 4px; height: 4px; border-radius: 50%; background: #ffd27a; box-shadow: 0 0 8px 2px rgba(255,160,60,.8); }
  .fx-p.gold { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px 2px rgba(232,198,106,.7); }

  /* ── 文字强调 ─────────────────────── */
  #dtext.em-danger { color: var(--danger); animation: emsh .12s linear 5; }
  @keyframes emsh { 50% { transform: translateX(3px); } }
  #dtext.em-voice { text-shadow: 2px 0 rgba(255,0,80,.5), -2px 0 rgba(0,200,255,.5); letter-spacing: .06em; }
  #dtext.em-whisper { color: var(--dim); font-size: 14px; }

  /* ── 场景图入场/浮动 ──────────────── */
  #sceneArt .art { display: inline-block; animation: artfloat 5s ease-in-out infinite; }
  #sceneArt .art.pop { animation: artpop .55s cubic-bezier(.2,1.6,.4,1), artfloat 5s ease-in-out .55s infinite; }
  @keyframes artpop { 0% { transform: translateY(-26px) scale(.6); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
  @keyframes artfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* ── 照片舞台 ─────────────────────── */
  .stage-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .bgl {
    position: absolute; inset: -4%;
    background-size: cover; background-position: center;
    opacity: 0; transition: opacity 1.1s ease;
  }
  .bgl.on { opacity: 1; animation: kenburns 34s ease-in-out infinite alternate; }
  @keyframes kenburns { from { transform: scale(1) translate(0,0); } to { transform: scale(1.1) translate(-1.4%,-1%); } }
  .stage-bg::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(11,14,20,.9) 0%, rgba(11,14,20,.24) 42%, rgba(11,14,20,.4) 100%);
  }
  body.reality .stage-bg::after {
    background: linear-gradient(to top, rgba(23,19,16,.9) 0%, rgba(23,19,16,.26) 42%, rgba(23,19,16,.4) 100%);
  }
  #sceneArt::before { z-index: 1; }
  #stageFocus {
    position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    padding-bottom: 6%; pointer-events: none;
  }
  #stageFocus img.focal {
    max-height: 46%; max-width: 72%;
    filter: drop-shadow(0 12px 34px rgba(0,0,0,.65));
  }
  #stageFocus img.focal.pop { animation: artpop .55s cubic-bezier(.2,1.6,.4,1); }
  #stageActors { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .actor {
    position: absolute; bottom: 3%; height: 58%; max-height: 350px;
    filter: drop-shadow(0 10px 26px rgba(0,0,0,.6));
    transition: filter .35s, transform .35s, opacity .3s;
  }
  .actor.posl { left: 3%; }
  .actor.posr { right: 3%; }
  .actor.enter { animation: actorin .5s ease-out; }
  @keyframes actorin { from { opacity: 0; transform: translateX(var(--dir,-36px)); } }
  .actor.talking { animation: talkbob .5s ease-in-out 2; filter: brightness(1.08) drop-shadow(0 10px 26px rgba(0,0,0,.6)); }
  @keyframes talkbob { 50% { transform: translateY(-7px); } }
  .actor.dim { filter: brightness(.5) saturate(.75) drop-shadow(0 10px 26px rgba(0,0,0,.6)); transform: scale(.94); }
  #fx img.fx-reveal-img {
    position: absolute; left: 50%; top: 42%; width: 210px; opacity: 0;
    transform: translate(-50%,-50%) scale(.3); filter: drop-shadow(0 0 26px rgba(232,198,106,.7));
    animation: fxreveal 1.35s ease-out forwards;
  }

  /* ── 地点氛围(挂在 #main 上) ────── */
  #sceneArt { position: relative; transition: background 1s; }
  #sceneArt::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .mood-street #sceneArt { background: linear-gradient(180deg, #0a1026 0%, #131b36 60%, #0b0e14 100%); }
  .mood-street #sceneArt::before { background: linear-gradient(100deg, transparent 30%, rgba(110,168,255,.08) 50%, transparent 70%); background-size: 300% 100%; animation: drift 16s linear infinite; }
  @keyframes drift { from { background-position: 0 0; } to { background-position: 300% 0; } }
  .mood-bank #sceneArt { background: linear-gradient(180deg, #071a20 0%, #0c2630 55%, #0b0e14 100%); }
  .mood-bank #sceneArt::before { background: linear-gradient(180deg, transparent 0%, rgba(90,220,220,.14) 50%, transparent 100%); background-size: 100% 220px; background-repeat: no-repeat; animation: scanv 3.5s linear infinite; }
  @keyframes scanv { from { background-position: 0 -220px; } to { background-position: 0 120%; } }
  .mood-bar #sceneArt { background: radial-gradient(ellipse at 50% 80%, #3a2410 0%, #1d1208 60%, #0b0e14 100%); }
  .mood-bar #sceneArt::before { background: radial-gradient(ellipse at 30% 30%, rgba(255,170,60,.16), transparent 55%); animation: flick 4s steps(1) infinite; }
  @keyframes flick { 0%,7%,13%,100% { opacity: 1; } 5%,11% { opacity: .3; } 60% { opacity: .85; } }
  .mood-roof #sceneArt { background: linear-gradient(200deg, #0a1330 0%, #101a3a 55%, #0b0e14 100%); }
  .mood-roof #sceneArt::before { background: repeating-linear-gradient(115deg, transparent 0 46px, rgba(160,190,255,.07) 46px 48px); background-size: 220% 100%; animation: drift 5s linear infinite; }
  .mood-lib #sceneArt { background: radial-gradient(ellipse at 50% 20%, #2a2314 0%, #171208 65%, #0b0e14 100%); }
  .mood-lib #sceneArt::before { background-image: radial-gradient(rgba(232,198,106,.28) 1px, transparent 1.6px); background-size: 90px 70px; animation: dust 14s linear infinite; }
  @keyframes dust { from { background-position: 0 0; } to { background-position: 60px 140px; } }
  .mood-city #sceneArt { background: linear-gradient(180deg, #0e2130 0%, #10303f 55%, #0b0e14 100%); }
  .mood-city #sceneArt::before { background: repeating-linear-gradient(0deg, rgba(160,230,255,.07) 0 1px, transparent 1px 7px); animation: scanv 6s linear infinite; background-size: 100% 300px; background-repeat: repeat; }
  .mood-house #sceneArt { background: radial-gradient(ellipse at 50% 40%, #221d18 0%, #14100c 65%, #0b0e14 100%); }
  .mood-house #sceneArt::before { background-image: radial-gradient(rgba(200,180,150,.16) 1px, transparent 1.6px); background-size: 70px 90px; animation: dust 18s linear infinite; }
  .mood-plaza #sceneArt { background: radial-gradient(ellipse at 50% 30%, #1a2040 0%, #10142a 60%, #0b0e14 100%); }
  .mood-plaza #sceneArt::before { background: radial-gradient(circle at 50% 32%, rgba(232,198,106,.14), transparent 45%); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
  body.reality #sceneArt { background: radial-gradient(ellipse at 50% 25%, #33271a 0%, #1d1610 60%, #171310 100%) !important; }
  body.reality #sceneArt::before { background: none !important; animation: none !important; }

  /* 00:42 卡片故障字 */
  #card.doom .big { animation: dglitch .8s steps(5) 1; }
  @keyframes dglitch {
    0% { text-shadow: 3px 0 rgba(255,0,80,.8), -3px 0 rgba(0,200,255,.8); transform: translateX(-4px); }
    40% { text-shadow: -4px 0 rgba(255,0,80,.8), 4px 0 rgba(0,200,255,.8); transform: translateX(3px) skewX(4deg); }
    70% { text-shadow: 2px 0 rgba(255,0,80,.8), -2px 0 rgba(0,200,255,.8); transform: translateX(-2px); }
    100% { text-shadow: none; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .flashfx, .fx-p, .fx-reveal, #sceneArt .art, #sceneArt::before,
    #app.shake, #app.shake-s, #app.glitchfx, #card.doom .big, #dtext { animation: none !important; }
  }

  /* ── 情报手册 ─────────────────────── */
  #journal {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(5,7,12,.72); backdrop-filter: blur(4px);
  }
  #journal.on { display: flex; align-items: center; justify-content: center; }
  #jpanel {
    width: min(560px, 94vw); height: min(600px, 88vh);
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #jhead { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  #jhead h3 { font-size: 17px; letter-spacing: .15em; font-weight: 500; }
  #jclose { background: none; border: none; color: var(--dim); font-size: 22px; cursor: pointer; }
  #jtabs { display: flex; border-bottom: 1px solid var(--line); }
  .jtab {
    flex: 1; padding: 10px; background: none; border: none; color: var(--dim);
    font-size: 14px; cursor: pointer; border-bottom: 2px solid transparent; position: relative;
  }
  .jtab.cur { color: var(--ink); border-bottom-color: var(--accent); }
  .jtab .dot { position: absolute; top: 8px; right: 14px; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); display: none; }
  .jtab.new .dot { display: block; }
  #jlist { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .jitem { border-bottom: 1px dashed var(--line); padding: 10px 2px; }
  .jitem .jname { font-size: 15px; }
  .jitem .jname .nnew { color: var(--danger); font-size: 11px; margin-left: 6px; }
  .jitem .jdesc { font-size: 13px; color: var(--dim); margin-top: 3px; line-height: 1.8; }
  .jempty { text-align: center; color: var(--dim); font-size: 13px; margin-top: 40px; line-height: 2; }

  /* ── toast ────────────────────────── */
  #toasts { position: fixed; top: 58px; left: 12px; z-index: 55; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast {
    background: rgba(19,24,38,.95); border: 1px solid var(--accent);
    border-radius: 10px; padding: 9px 14px; font-size: 13px;
    max-width: 78vw;
    animation: toastin .3s ease-out;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  .toast.warn { border-color: var(--danger); }
  @keyframes toastin { from { opacity: 0; transform: translateX(-14px); } }
  .toast.out { transition: opacity .5s; opacity: 0; }

  @media (max-width: 640px) {
    #locGrid { grid-template-columns: repeat(2, 1fr); }
    #title h1 { font-size: 34px; }
    #card .big { font-size: 30px; }
    #dtext { font-size: 15px; }
    #sceneArt { font-size: 56px; }
    .actor { height: 46%; }
    #stageFocus img.focal { max-height: 40%; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span id="nightLabel">第 1 夜</span>
    <span id="clock">22:00</span>
    <div id="timebar"><div id="timefill"></div></div>
    <button id="journalBtn">情报手册<span class="dot"></span></button>
  </div>
  <div id="main">
    <div id="title"></div>
    <div id="map">
      <div id="mapHint"></div>
      <div id="locGrid"></div>
    </div>
    <div id="locPanel"></div>
    <div id="sceneView">
      <div id="sceneArt">
        <div class="stage-bg"><div class="bgl" id="bgA"></div><div class="bgl" id="bgB"></div></div>
        <div id="stageFocus"></div>
        <div id="stageActors"></div>
      </div>
      <div id="dialog">
        <div id="dbox">
          <div id="dname"></div>
          <div id="dtext"></div>
          <div id="dnext">▼</div>
        </div>
        <div id="choices"></div>
      </div>
    </div>
  </div>
</div>

<div id="fx"></div>
<div id="card"></div>
<div id="flash"></div>
<div id="journal">
  <div id="jpanel">
    <div id="jhead"><h3>情报手册</h3><button id="jclose">×</button></div>
    <div id="jtabs"></div>
    <div id="jlist"></div>
  </div>
</div>
<div id="toasts"></div>

<script src="save.js"></script>
<script src="data.js"></script>
<script src="engine.js"></script>
</body>
</html>
